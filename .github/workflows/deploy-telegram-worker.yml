name: Deploy JET Telegram Worker

on:
  push:
    branches: [main]
    paths:
      - "cloudflare-worker/**"
      - ".github/workflows/deploy-telegram-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Wrangler
        run: npm install --global wrangler
      - name: Configure Cloudflare secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          JET_ADMIN_KEY: ${{ secrets.JET_ADMIN_KEY }}
        run: |
          node -e 'const fs=require("fs"); fs.writeFileSync("/tmp/worker-secrets.json", JSON.stringify({TELEGRAM_BOT_TOKEN:process.env.TELEGRAM_BOT_TOKEN,JET_ADMIN_KEY:process.env.JET_ADMIN_KEY}))'
          wrangler secret bulk /tmp/worker-secrets.json --name jet-telegram-worker
          rm -f /tmp/worker-secrets.json
      - name: Deploy Worker
        working-directory: cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy
